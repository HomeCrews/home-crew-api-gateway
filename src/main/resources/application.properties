# ONE import line, not one per profile.
#
# Both application.properties and application-container.properties are processed
# when the container profile is active, so an import in each meant a container
# resolved BOTH - including localhost:8888, which is unreachable from inside a
# container. That was harmless only because every import was optional:. With
# fail-fast on it takes the service down. The URI is a placeholder instead, and
# docker-compose.yml sets CONFIG_SERVER_URI in its shared environment anchor.
#
# optional: covers the local case where config-server is not running. It is
# overridden by fail-fast, which compose sets to true: ConfigServerConfigDataLoader
# throws when failFast || !optional, so fail-fast is the real switch.
spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

# config-server now requires HTTP basic: it decrypts {cipher} values, so an open
# /decrypt would hand every secret in home-crew-config to anyone who can reach
# port 8888.
#
# The password carries a default for the same reason DB_USERNAME does - the
# policy in home-crew-config/README.md allows one when the value is public
# knowledge and only unlocks a throwaway local resource. It keeps a host-run
# `./mvnw spring-boot:run` working with no shell setup. docker-compose.yml
# overrides both from .env, and deploy.yml from a GitHub secret.
spring.cloud.config.username=${CONFIG_CLIENT_USERNAME:configclient}
spring.cloud.config.password=${CONFIG_CLIENT_PASSWORD:localdev}

# Live wherever fail-fast is on, which compose sets: ConfigClientRetryBootstrapper
# installs a RetryTemplate only when fail-fast is set AND spring-retry is on the
# classpath, and spring-retry is <optional>true</optional> in
# spring-cloud-config-client, so the pom adds it explicitly. compose orders
# clients behind `config-server: condition: service_healthy`, but only at first
# start. This covers what that cannot: a service starting or hot reloading while
# config-server is itself restarting, which is routine in the dev stack. Without
# it the config import fails at once and the service goes down.
spring.cloud.config.retry.max-attempts=12
spring.cloud.config.retry.initial-interval=2000
spring.cloud.config.retry.max-interval=10000
spring.cloud.config.retry.multiplier=1.3
spring.cloud.config.request-read-timeout=10000
spring.cloud.config.request-connect-timeout=5000

# The Eureka URL now comes from home-crew-config (application.yml and
# application-container.yml). It is deliberately NOT here: leaving a local copy
# would mask a config-server outage, because the built-in Eureka default is
# localhost:8761, which inside a container is nothing - the service would start,
# register nowhere, and look fine.
